<!doctype html>
<html><head><title>Login</title></head>
<body>
<form onsubmit="return false">
  <label for="user">User</label><input id="user" name="user">
  <label for="pass">Password</label><input id="pass" name="pass" type="password">
  <label for="code">Code</label><input id="code" name="code" autocomplete="one-time-code">
  <label for="tk">API key</label><input id="tk" name="api_token">
  <button type="submit">Sign in</button>
</form>
</body></html>
