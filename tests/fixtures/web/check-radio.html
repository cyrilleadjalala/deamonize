<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Check and radio</title></head>
<body>
  <label><input type="checkbox" id="news"> Newsletter</label>
  <label><input type="checkbox" id="terms" checked> Terms</label>
  <div style="width:40px;height:20px;border:1px solid" role="switch" aria-checked="false" tabindex="0" id="dark" aria-label="Dark mode"></div>
  <div style="width:20px;height:20px;border:1px solid" role="checkbox" aria-checked="false" tabindex="0" id="notify" aria-label="Notify me"></div>
  <fieldset>
    <legend>Size</legend>
    <label><input type="radio" name="size" value="s"> Small</label>
    <label><input type="radio" name="size" value="m" checked> Medium</label>
    <label><input type="radio" name="size" value="l"> Large</label>
  </fieldset>
  <label><input type="checkbox" id="locked" disabled> Locked</label>
  <label><input type="checkbox" id="stuck"> Stuck</label>
  <button id="clicks" type="button">Clicks: <span id="count">0</span></button>
  <div id="log" aria-live="polite"></div>
  <script>
    let count = 0;
    const log = (text) => { document.getElementById('log').textContent += text + ';'; };
    document.addEventListener('click', (e) => {
      if (e.target.closest('input,[role=switch],[role=checkbox]')) { count++; document.getElementById('count').textContent = String(count); }
    });
    for (const id of ['dark', 'notify']) {
      const el = document.getElementById(id);
      const toggle = () => el.setAttribute('aria-checked', el.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
      el.addEventListener('click', toggle);
    }
    // A control that never reaches the state: it refuses every click
    document.getElementById('stuck').addEventListener('click', (e) => e.preventDefault());
  </script>
</body>
</html>
