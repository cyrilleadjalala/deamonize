<!doctype html>
<html><head><meta charset="utf-8"><title>Notes</title></head>
<body>
<button type="button" class="start">Start note</button>
{{@@@@<section>}}<div contenteditable="true" role="textbox" aria-label="{{Notes@@Notes@@Memo}}"></div>{{@@@@</section>}}
<button type="button" class="save">Save notes</button>
<button type="button" class="finish">Done</button>
<script>
  const log = (message) => navigator.sendBeacon('/log', message);
  document.querySelector('.start').addEventListener('click', () => log('start'));
  document.querySelector('.save').addEventListener('click', () => log('notes:' + document.querySelector('[contenteditable]').innerText));
  document.querySelector('.finish').addEventListener('click', () => log('done'));
</script>
</body></html>
