<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>Daemonize Studio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>

<body>
  <a class="skip-link" href="#main" id="skip-link">Skip to content</a>
  <div id="sample-banner" class="sample-banner" role="note" hidden></div>

  <header class="app-header">
    <a class="brand" href="#/">
      <svg class="logo" viewBox="0 0 40 40" width="38" height="38" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="ghost-body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#d9c8ff" />
            <stop offset="1" stop-color="#8e6bf0" />
          </linearGradient>
        </defs>
        <path d="M11 11 L8.5 3.5 L16.5 8 Z" fill="#ffa24d" />
        <path d="M29 11 L31.5 3.5 L23.5 8 Z" fill="#ffa24d" />
        <path
          d="M7 35 V19 C7 11 12.5 6.5 20 6.5 C27.5 6.5 33 11 33 19 V35 L28.5 31 L24.25 35 L20 31 L15.75 35 L11.5 31 Z"
          fill="url(#ghost-body)" />
        <ellipse cx="15" cy="19" rx="2.6" ry="3.4" fill="#1a1230" />
        <ellipse cx="25" cy="19" rx="2.6" ry="3.4" fill="#1a1230" />
        <circle cx="15.7" cy="18" r="1.1" fill="#ffa24d" />
        <circle cx="25.7" cy="18" r="1.1" fill="#ffa24d" />
        <path d="M16.5 25.5 Q20 28 23.5 25.5" fill="none" stroke="#1a1230" stroke-width="1.6" stroke-linecap="round" />
      </svg>
      <span class="brand-text">
        <span class="brand-name">Daemonize <strong>Studio</strong></span>
        <span class="brand-tag">Give any app a voice. Inspect what it learned.</span>
      </span>
    </a>
    <nav class="main-nav" aria-label="Main">
      <ul id="main-nav-list">
        <li><a href="#/" data-route="overview">Overview</a></li>
        <li><a href="#/workflows" data-route="workflows">Workflows</a></li>
        <li><a href="#/graph" data-route="graph">Graph</a></li>
        <li><a href="#/schemas" data-route="schemas">Schemas</a></li>
        <li><a href="#/tests" data-route="tests">Tests</a></li>
        <li><a href="#/playground" data-route="playground">Playground</a></li>
        <li id="nav-credentials" hidden><a href="#/credentials" data-route="credentials">Credentials</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" tabindex="-1" aria-live="off">
    <p class="state loading" role="status">Loading Studio&hellip;</p>
  </main>

  <footer class="app-footer">
    <span>Secrets are shown by name only. Values never leave your machine.</span>
    <button type="button" class="btn btn-quiet" id="print-btn">Print view</button>
  </footer>
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>
  <noscript>
    <p class="state error">Daemonize Studio needs JavaScript to draw its views.</p>
  </noscript>
</body>

</html>
